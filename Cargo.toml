[package]
name = "bugslayer-cli"
version = "0.1.2"
edition = "2021"
authors = ["Marcus Eliasson <marcus@bitcraze.io>"]
description = "Bugslayer deck command-line client"
readme = "README.md"
repository = "https://github.com/evoggy/bugslayer-cli"
license = "MIT OR Apache-2.0"
build = "build.rs"

[package.metadata.deb]
name = "bscli"
maintainer = "Marcus Eliasson <marcus@bitcraze.io>"
copyright = "2026, Marcus Eliasson"
extended-description = """\
Command-line client for the Bugslayer deck, a debug deck for the Crazyflie:
SWD probes, logic capture, SPI and deck control."""
depends = "$auto"
section = "utils"
priority = "optional"
maintainer-scripts = "debian/"
assets = [
    ["target/release/bscli", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/bscli/", "644"],
    # Shell completions are generated by build.rs into completions/.
    ["completions/bscli.bash", "usr/share/bash-completion/completions/bscli", "644"],
    ["completions/_bscli", "usr/share/zsh/vendor-completions/_bscli", "644"],
    ["completions/bscli.fish", "usr/share/fish/vendor_completions.d/bscli.fish", "644"],
    # USB access to the deck for logged-in users.
    ["udev/70-bugslayer-deck.rules", "usr/lib/udev/rules.d/", "644"],
    # Signing key for the evoggy APT repo; postinst installs it as the keyring.
    ["debian/evoggy-archive-keyring.gpg", "usr/share/bscli/", "644"],
]

[[bin]]
name = "bscli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bugslayer = { path = "../bugslayer-lib" }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
colored = "3.1.1"
confy = "2.0.0"
ctrlc = "3"
indicatif = "0.18.6"
inquire = "0.9.4"
nusb = "0.2.7"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = { version = "4.10", features = ["usbportinfo-interface"] }
ureq = { version = "3", features = ["json"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Used by build.rs to generate shell-completion scripts from the same clap
# command tree as the binary (src/cli.rs is shared via include!).
[build-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
