[package]
name = "bugslayer-cli"
version = "0.1.0"
edition = "2021"
authors = ["Marcus Eliasson <marcus@bitcraze.io>"]
description = "Bugslayer deck command-line client"
readme = "README.md"
license = "MIT OR Apache-2.0"
build = "build.rs"

[[bin]]
name = "bsly"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
colored = "3.1.1"
confy = "2.0.0"
ctrlc = "3"
indicatif = "0.18.6"
inquire = "0.9.4"
nusb = "0.2.7"
serde = { version = "1.0.229", features = ["derive"] }
serialport = "4.10"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Used by build.rs to generate shell-completion scripts from the same clap
# command tree as the binary (src/cli.rs is shared via include!).
[build-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
